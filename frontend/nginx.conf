
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://civicpulse-api.calmcliff-caf52d72.southafricanorth.azurecontainerapps.io;

        proxy_ssl_server_name on;
        proxy_set_header Host civicpulse-api.calmcliff-caf52d72.southafricanorth.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass https://civicpulse-api.calmcliff-caf52d72.southafricanorth.azurecontainerapps.io;

        proxy_ssl_server_name on;
        proxy_set_header Host civicpulse-api.calmcliff-caf52d72.southafricanorth.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
