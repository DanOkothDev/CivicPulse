services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: DanPostgres2026!
      POSTGRES_DB: civicpulse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://civicpulse:DanPostgres2026!@db:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      UPLOAD_FOLDER: /app/uploads          # the same photos the API saves, shared from ./uploads
      AI_CLASSIFIER: ${AI_CLASSIFIER:-}
      AI_DUPLICATES: ${AI_DUPLICATES:-}
    volumes: ["./uploads:/app/uploads"]
    depends_on: [db, redis]
    restart: unless-stopped
volumes:
  pgdata: