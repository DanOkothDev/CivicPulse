openapi: 3.0.3
info:
  title: CivicPulse API
  version: 1.0.0
  description: |
    API contract between the Flask backend, the React frontend and the AI worker.
    Conventions:
    - All paths are under /api/v1. JSON in and out, except POST /reports (multipart).
    - Auth uses a JWT [a signed token the app sends with each request to prove who the user is]
      in the header `Authorization: Bearer <token>`.
    - Times are ISO 8601 UTC strings. Locations are decimal degrees (lat, lon).
    - Lists are paginated with `page` and `per_page` and return {items, page, per_page, total}.
    - Errors always look like {error: {code, message, details}}.
    - Status flow: reported -> verified -> assigned -> in_progress -> resolved.
      A verifier may also reject a reported item (status rejected).
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Reports
  - name: Workflow
  - name: Duplicates
  - name: Notifications
  - name: Reference
  - name: Analytics
  - name: Admin
  - name: Preferences
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a resident account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 255}
                password: {type: string}
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged-in user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticatedUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /counties:
    get:
      tags: [Reference]
      summary: List the configured counties
      security: []
      responses:
        '200':
          description: County records; the local seed contains Kenya's 47 counties
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/County'}
  /counties/{county_id}/departments:
    get:
      tags: [Reference]
      summary: List departments configured for a county
      security: []
      parameters:
        - name: county_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Departments in the county
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Department'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Admin]
      summary: Create a department in a county (county admin or national admin)
      parameters:
        - name: county_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                code: {type: string, nullable: true, maxLength: 60, pattern: '^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$'}
      responses:
        '201':
          description: Created department
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Department'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /departments/{department_id}:
    parameters:
      - name: department_id
        in: path
        required: true
        schema: {type: integer}
    patch:
      tags: [Admin]
      summary: Update a department in the admin's authorized county
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                code: {type: string, nullable: true, maxLength: 60, pattern: '^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$'}
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Department'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Admin]
      summary: Delete an unreferenced department in the admin's authorized county
      description: Returns 409 when any user or report is still assigned to the department; no records are cascade-deleted.
      responses:
        '204': {description: Department deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/me/profile:
    patch:
      tags: [Auth]
      summary: Update the resident's registered county
      description: Residents may update county_id only. Role and department assignments are not editable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [county_id]
              additionalProperties: false
              properties:
                county_id: {type: integer}
      responses:
        '200':
          description: Updated authenticated user profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticatedUser'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/me/preferences:
    get:
      tags: [Preferences]
      summary: Get the authenticated user's onboarding preferences
      responses:
        '200':
          description: The current user's preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingPreferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Preferences]
      summary: Update the authenticated user's onboarding preferences
      description: |
        Preferences are scoped to the authenticated user. The completion timestamp is set by the
        server when onboarding_completed changes to true and cannot be supplied by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingPreferenceUpdate'}
      responses:
        '200':
          description: The updated preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingPreferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
  /reports:
    post:
      tags: [Reports]
      summary: Submit a report (resident)
      description: |
        Sent as multipart/form-data [a request format that carries a file plus normal form fields].
        The report county is resolved from these geographic coordinates, not the resident's registered county.
        After saving, the API queues an AI job (category suggestion and duplicate check).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category_id, lat, lon, photo]
              properties:
                category_id: {type: integer}
                description: {type: string, maxLength: 500}
                address: {type: string, maxLength: 255}
                landmark: {type: string, maxLength: 120}
                lat: {type: number, minimum: -90, maximum: 90}
                lon: {type: number, minimum: -180, maximum: 180}
                photo: {type: string, format: binary, description: 'JPEG or PNG, max 5 MB'}
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
    get:
      tags: [Reports]
      summary: List reports (map and lists)
      parameters:
        - name: bbox
          in: query
          description: 'Bounding box [a rectangle on the map] as min_lon,min_lat,max_lon,max_lat'
          schema: {type: string, example: '36.80,-1.30,36.85,-1.25'}
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/Status'}}
        - {name: area_id, in: query, schema: {type: integer}}
        - {name: search, in: query, description: Search report descriptions, addresses, landmarks, categories, or exact report ids, schema: {type: string}}
        - {name: mine, in: query, description: 'Only reports created by the current user', schema: {type: boolean}}
        - {name: following, in: query, description: 'Only reports the current user follows', schema: {type: boolean}}
        - {name: include_duplicates, in: query, description: 'Default false: duplicates are hidden and counted in the parent', schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: A page of reports
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportPage'}
  /reports/classify:
    post:
      tags: [Reports]
      summary: Get a non-blocking AI category suggestion
      description: |
        Authenticated JPEG/PNG upload. Category names are mapped from supported
        model classes; unsupported or unavailable predictions do not block
        manual report submission.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: {type: string, format: binary}
      responses:
        '200':
          description: A supported category suggestion or an unavailable/unsupported result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: {type: boolean}
                  supported: {type: boolean}
                  category:
                    allOf:
                      - {$ref: '#/components/schemas/Category'}
                    nullable: true
                  confidence: {type: number, minimum: 0, maximum: 1}
                  class_name: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503':
          description: Classification failed; manual category selection remains available
  /reports/{id}/classification-feedback:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    post:
      tags: [Reports]
      summary: Submit resident classification feedback
      description: One feedback record per owned report. It starts pending and is not training-eligible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [predicted_class, confidence, selected_category_id, accepted]
              properties:
                predicted_class: {type: string, maxLength: 100}
                predicted_category_id: {type: integer, nullable: true}
                confidence: {type: number, minimum: 0, maximum: 1}
                selected_category_id: {type: integer}
                accepted: {type: boolean}
      responses:
        '201': {description: Pending feedback stored against the report image}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: The authenticated resident does not own the report}
        '409': {description: Feedback already exists for the report}
        '422': {$ref: '#/components/responses/Invalid'}
  /classification-feedback:
    get:
      tags: [Workflow]
      summary: List feedback for verifier review
      description: Verifier/admin only. Defaults to pending feedback.
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected], default: pending}
      responses:
        '200': {description: Feedback records with report, prediction, selected category, and review status}
        '403': {description: Verifier or administrator role required}
  /classification-feedback/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    patch:
      tags: [Workflow]
      summary: Approve or reject resident feedback
      description: Verifier/admin only. Approval marks the example eligible for explicit dataset export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_status]
              properties:
                review_status: {type: string, enum: [approved, rejected]}
      responses:
        '200': {description: Reviewed feedback}
        '403': {description: Verifier or administrator role required}
        '409': {description: Feedback has already been reviewed}
        '422': {$ref: '#/components/responses/Invalid'}
  /reports/{id}:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    get:
      tags: [Reports]
      summary: One report with its details
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reports/{id}/history:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    get:
      tags: [Workflow]
      summary: Status trail of a report
      responses:
        '200':
          description: Every status change, oldest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StatusEvent'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reports/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    patch:
      tags: [Workflow]
      summary: Change status (verifier, authority, admin)
      description: |
        Allowed moves: reported->verified, reported->rejected, assigned->in_progress, in_progress->resolved.
        Moving to assigned is done only through POST /reports/{id}/assign (409 use_assign_endpoint).
        Verifier or admin: verified and rejected (rejecting needs a note). Assigned authority or admin:
        in_progress and resolved. rejected and resolved are final. A merged duplicate cannot be updated
        directly (409 is_duplicate). Each change creates a status event and notifies followers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/Status'}
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /reports/{id}/assign:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    post:
      tags: [Workflow]
      summary: Assign to an authority user (verifier, authority, admin)
      description: |
        The report must be verified. assignee_id must be an authority assigned to the report's county
        and department. due_date is optional and cannot be in the past. A report that is assigned but
        not started can be reassigned with the same call; once in_progress it cannot (409 cannot_reassign).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id]
              properties:
                assignee_id: {type: integer}
                due_date: {type: string, format: date}
      responses:
        '200':
          description: Updated report (status becomes assigned)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /reports/{id}/area:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    patch:
      tags: [Workflow]
      summary: Set or clear a report's area (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area_id]
              properties:
                area_id: {type: integer, nullable: true}
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /reports/{id}/follow:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    post:
      tags: [Reports]
      summary: Follow a report to get notifications
      responses:
        '204': {description: Following}
    delete:
      tags: [Reports]
      summary: Stop following
      responses:
        '204': {description: Not following}
  /reports/{id}/duplicates:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    get:
      tags: [Duplicates]
      summary: AI duplicate suggestions for a report (verifier, admin)
      description: Stored by the AI worker after each new report. The reasons show why two reports match.
      responses:
        '200':
          description: Suggestions, best score first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DuplicateSuggestion'}
  /reports/{id}/merge:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    post:
      tags: [Duplicates]
      summary: Confirm a duplicate by merging into a parent (verifier, admin)
      description: |
        The report in the path (the child) is folded into parent_id. Only reported or verified reports can be
        merged, into a parent that is still open. Reports already merged into the child move to the parent,
        so merging stays one level deep. Followers and the author of the child follow the parent.
        report_count on the parent is recomputed. Errors (409 codes): self_merge, already_merged,
        parent_is_duplicate, child_not_mergeable, parent_not_open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id]
              properties:
                parent_id: {type: integer}
      responses:
        '200':
          description: Parent report with updated report_count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /reports/{id}/unmerge:
    parameters:
      - {$ref: '#/components/parameters/ReportId'}
    post:
      tags: [Duplicates]
      summary: Split a wrongly merged report back out (verifier, admin)
      description: Returns 409 not_merged if the report was not merged. The parent's report_count is recomputed.
      responses:
        '200':
          description: The report is its own case again
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
  /notifications:
    get:
      tags: [Notifications]
      summary: Current user's notifications, newest first
      description: |
        Created automatically when a report's status changes (to its author, followers, and authors of
        reports merged into it, but never to the person who made the change), when a report is assigned
        or reassigned (to the assignee, and the old assignee), and when a report is merged into another.
      parameters:
        - {name: unread, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Notification'}
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark as read
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Marked read (safe to repeat)}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Number of unread notifications (for the bell badge)
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification as read
      responses:
        '204': {description: All marked read}
  /categories:
    get:
      tags: [Reference]
      summary: Report categories
      security: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Category'}
    post:
      tags: [Reference]
      summary: Create a report category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 60}
                icon: {type: string, maxLength: 40}
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /areas:
    get:
      tags: [Reference]
      summary: Wards or zones
      security: []
      responses:
        '200':
          description: All areas
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Area'}
    post:
      tags: [Reference]
      summary: Create an area (admin)
      description: boundary is an optional GeoJSON Polygon in longitude/latitude order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 120}
                boundary: {$ref: '#/components/schemas/Polygon'}
      responses:
        '201':
          description: Area created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Area'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /areas/{id}:
    patch:
      tags: [Reference]
      summary: Set or clear an area's boundary (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boundary]
              properties:
                boundary:
                  allOf:
                    - {$ref: '#/components/schemas/Polygon'}
                  nullable: true
      responses:
        '200':
          description: Updated area
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Area'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Dashboard numbers (authority, admin)
      description: |
        Counts cases: a report merged into another one is not counted twice. by_status has every status
        (0 when empty). by_category has every category name. avg_days_to_resolve is null until something
        is resolved. Pass area_id to limit report counts and hotspot_count. A hotspot is associated with an area
        when its center is inside that area's configured boundary.
      parameters:
        - {name: area_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsSummary'}
  /analytics/categories:
    get:
      tags: [Analytics]
      summary: Cases per category (authority, admin)
      parameters:
        - {name: area_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: One entry per category, including those with 0
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category_id: {type: integer}
                    category: {type: string}
                    count: {type: integer}
  /analytics/statuses:
    get:
      tags: [Analytics]
      summary: Cases per status (authority, admin)
      parameters:
        - {name: area_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Only statuses that have at least one case
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: {$ref: '#/components/schemas/Status'}
                    count: {type: integer}
  /analytics/trends:
    get:
      tags: [Analytics]
      summary: Reports submitted per day (authority, admin)
      description: Counts every submitted report, duplicates included. Days are UTC days. Invalid days returns 400 invalid_days.
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 30, minimum: 1, maximum: 365}}
      responses:
        '200':
          description: One entry per day, oldest first, including days with 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: {type: integer}
                  daily_reports:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        count: {type: integer}
  /analytics/hotspots:
    get:
      tags: [Analytics]
      summary: Clusters of reports (authority, admin)
      description: Hotspots found by the clustering job, biggest first. They refresh automatically after new reports (at most every HOTSPOT_REFRESH_MINUTES) and on demand with the recompute endpoint.
      parameters:
        - {name: area_id, in: query, description: Return hotspots whose centers are inside this area's boundary, schema: {type: integer}}
      responses:
        '200':
          description: Hotspots from the clustering job
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Hotspot'}
  /analytics/hotspots/recompute:
    post:
      tags: [Analytics]
      summary: Re-run the clustering now (admin)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eps_m: {type: number, default: 250, description: 'Reports closer than this (metres) can join a cluster. 1 to 20000'}
                min_samples: {type: integer, default: 3, description: 'Reports needed to make a hotspot. 1 to 1000'}
      responses:
        '200':
          description: What the run found
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters_created: {type: integer}
                  noise_reports: {type: integer, description: 'Reports not in any cluster'}
                  reports_considered: {type: integer}
                  eps_m: {type: number}
                  min_samples: {type: integer}
        '400': {description: 'invalid_parameters'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users:
    get:
      tags: [Admin]
      summary: List users (admin, or verifier/authority for authority users only)
      description: |
        Admins can filter any role and see emails. Verifiers and authorities always get only authority users
        (for the assign dropdown), without emails, and asking for another role returns 403.
      parameters:
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
  /users/{id}/role:
    patch:
      tags: [Admin]
      summary: Change a user's role (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
  /users/{id}/department:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    patch:
      tags: [Admin]
      summary: Assign an authority user to a department in their county
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_id]
              additionalProperties: false
              properties:
                department_id: {type: integer, nullable: true}
      responses:
        '200':
          description: Updated authority user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticatedUser'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema: {type: integer}
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Your role cannot do this
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Not allowed in the current state (for example an invalid status move)
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: Validation failed
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string, example: invalid_transition}
            message: {type: string}
            details: {type: object}
    Role: {type: string, enum: [resident, verifier, authority, admin]}
    Status: {type: string, enum: [reported, verified, rejected, assigned, in_progress, resolved]}
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, maxLength: 120}
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, minLength: 8}
        area_id: {type: integer}
        county_id: {type: integer, description: County record ID obtained from GET /counties}
    AuthResponse:
      type: object
      properties:
        token: {type: string}
        user: {$ref: '#/components/schemas/AuthenticatedUser'}
    User:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        area_id: {type: integer, nullable: true}
        county_id: {type: integer, nullable: true}
        county:
          allOf:
            - {$ref: '#/components/schemas/County'}
          nullable: true
        department_id: {type: integer, nullable: true}
        department:
          allOf:
            - {$ref: '#/components/schemas/Department'}
          nullable: true
    County:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        code: {type: string}
    Department:
      type: object
      properties:
        id: {type: integer}
        county_id: {type: integer}
        name: {type: string}
        code: {type: string, nullable: true}
    AuthenticatedUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          properties:
            onboarding_completed: {type: boolean}
            product_tour_enabled: {type: boolean}
            feature_tips_enabled: {type: boolean}
            onboarding_completed_at: {type: string, format: date-time, nullable: true}
    OnboardingPreferences:
      type: object
      properties:
        onboarding_completed: {type: boolean}
        product_tour_enabled: {type: boolean}
        feature_tips_enabled: {type: boolean}
        onboarding_completed_at: {type: string, format: date-time, nullable: true}
    OnboardingPreferenceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        onboarding_completed: {type: boolean}
        product_tour_enabled: {type: boolean}
        feature_tips_enabled: {type: boolean}
    Category:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: Pothole}
        icon: {type: string, example: pothole}
    Area:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        boundary: {$ref: '#/components/schemas/Polygon'}
    Polygon:
      type: object
      nullable: true
      description: GeoJSON Polygon with longitude/latitude coordinate pairs and closed rings.
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Polygon]}
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: {type: number}
    Location:
      type: object
      properties:
        lat: {type: number}
        lon: {type: number}
    Report:
      type: object
      properties:
        id: {type: integer}
        category: {$ref: '#/components/schemas/Category'}
        description: {type: string}
        address: {type: string, nullable: true}
        landmark: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/Status'}
        location: {$ref: '#/components/schemas/Location'}
        area_id: {type: integer, nullable: true}
        county_id: {type: integer, nullable: true, description: Determined from the report's coordinates}
        county:
          allOf:
            - {$ref: '#/components/schemas/County'}
          nullable: true
        department_id: {type: integer, nullable: true}
        department:
          allOf:
            - {$ref: '#/components/schemas/Department'}
          nullable: true
        photo_url: {type: string}
        created_by: {type: integer}
        assigned_to: {type: integer, nullable: true}
        due_date: {type: string, format: date, nullable: true}
        report_count: {type: integer, description: 'Residents who reported this same case (1 plus merged duplicates)'}
        duplicate_of: {type: integer, nullable: true, description: 'Parent report id if this was merged'}
        ai_suggested_category:
          type: object
          nullable: true
          properties:
            category_id: {type: integer}
            name: {type: string}
            confidence: {type: number, minimum: 0, maximum: 1}
        classification_feedback:
          type: object
          nullable: true
          properties:
            predicted_category: {$ref: '#/components/schemas/Category'}
            confidence: {type: number, minimum: 0, maximum: 1}
            selected_category: {$ref: '#/components/schemas/Category'}
            accepted: {type: boolean}
            review_status: {type: string, enum: [pending, approved, rejected]}
            training_eligible: {type: boolean}
        is_following: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReportPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Report'}
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
    StatusEvent:
      type: object
      properties:
        id: {type: integer}
        report_id: {type: integer}
        status: {$ref: '#/components/schemas/Status'}
        changed_by: {type: integer}
        note: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    DuplicateSuggestion:
      type: object
      description: Output of the find_duplicates function from the AI worker
      properties:
        report_id: {type: integer, description: 'The existing report this one may duplicate'}
        score: {type: number, minimum: 0, maximum: 1}
        reasons:
          type: object
          properties:
            location: {type: number}
            category: {type: number}
            time: {type: number}
            photo: {type: number, nullable: true}
    Notification:
      type: object
      properties:
        id: {type: integer}
        report_id: {type: integer}
        message: {type: string, example: Your report is now in progress}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
    AnalyticsSummary:
      type: object
      properties:
        total_reports: {type: integer}
        open_reports: {type: integer, description: 'Cases not yet resolved or rejected'}
        resolved_reports: {type: integer}
        hotspot_count: {type: integer}
        by_status:
          type: object
          additionalProperties: {type: integer}
        by_category:
          type: object
          additionalProperties: {type: integer}
        open_by_area:
          type: array
          items:
            type: object
            properties:
              area_id: {type: integer, nullable: true}
              area: {type: string, description: 'Area name, or "No area"'}
              open: {type: integer}
        avg_days_to_resolve: {type: number, nullable: true}
    Hotspot:
      type: object
      properties:
        id: {type: integer}
        center: {$ref: '#/components/schemas/Location'}
        radius_m: {type: number}
        report_count: {type: integer}
        top_category_id: {type: integer}
        top_category: {type: string, nullable: true, description: 'Name of the most common category'}
        computed_at: {type: string, format: date-time}